role: Postdoctoral Researcher in Linguistics
bio: |
  I research how languages diversify over time and how we can trace and explain diversification. I work on tone and sound change, subgrouping, and person marking, with a focus on Mixtecan (Mexico). I combine quantitative methods and data-driven comparison with detailed analyses of individual varieties. To develop the empirical foundations needed, I conduct long-term fieldwork on Mixtec and Cuicatec varieties and develop openly available cross-linguistic resources.

  I'm currently a postdoctoral researcher in the Department of Linguistics at the University of Bern. I have a PhD in Linguistics from the University of California, Santa Barbara (USA) and the Department of Linguistic and Cultural Evolution at the Max Planck Institute for Evolutionary Anthropology in Leipzig (Germany).
  My [dissertation](/content/research/thesis-project) is a collection of three articles on Mixtec(an) language history using qualitative and quantitative methods.

  **News and updates:**
  - I got a [Firebird Research Grant](https://www.firebirdresearchgrants.org/) for continuing the documentation of Santos Reyes Pápalo Cuicatec
  - November 2026: I will give a talk at the [Transalpine Typology Meeting](https://sites.google.com/unipv.it/transalpine-typology-meeting/ttm26?pli=1&authuser=0) in Munich on Mixtec pronouns and classifiers
  - August 2026: Co-hosted a workshop on [Microtypology](https://societaslinguistica.eu/sle2026/wp-content/uploads/sites/9/2025/12/Microtypology_updated.pdf) at SLE with Linda Konnerth and Sergey Say
  - July 2026: I contributed to a position paper on language documentation infrastructure (/publication/gessler-2026-the-missing)
  - April 2026: New database paper out in [Journal of Open Humanities Data](/publication/auderset-2026-a-database)


